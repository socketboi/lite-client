# A donor for the REALITY rig: a TLS server the rig can proxy a stranger to without leaving the
# machine. Using a real site here made the test bed depend on someone else's rate limiting, which is
# how eight concurrent handshakes came to look like a client bug.
events {}
http {
    server {
        listen 8444 ssl;
        server_name www.avito.ru;
        ssl_certificate     /donor/c.pem;
        ssl_certificate_key /donor/k.pem;
        location / { return 200 "donor\n"; }
    }
}
