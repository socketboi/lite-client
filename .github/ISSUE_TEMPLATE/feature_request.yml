name: Feature request
description: Something the reference client does that this one does not, or a change to packaging, configuration or diagnostics.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This client reproduces Xray-core (VLESS, XTLS-Vision, REALITY) and hysteria (Hysteria2)
        on the wire and does nothing else there. A protocol feature is in scope when the reference
        client has it; behaviour the reference does not have is not accepted, however useful.
        A server side, a routing engine, a JSON config or a third protocol are out of scope.

        Packaging, the init script, UCI options and diagnostics are not bound by the reference.
        For those, describe the problem you have rather than the solution you picture.

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - protocol behaviour the reference client has
        - OpenWrt package, init script or UCI configuration
        - diagnostics, logging or statistics
        - build, tooling or tests
        - other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: Where the reference does it
      description: |
        For protocol behaviour: the reference, its version, and the file and lines, for example
        `Xray-core v26.9.9, proxy/vless/outbound/outbound.go:332-347`. A link to the upstream
        source at a tag is fine.

  - type: textarea
    id: cost
    attributes:
      label: Cost on the router
      description: |
        Anything you know about flash, RAM or CPU cost, and which devices you care about
        (target and flash size).

  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md first).
